<!--
  SHI Partnership Presentation Template
  ======================================
  Usage: Ask Claude to create a partnership presentation for a potential partner.

  Trigger: /shi-presentation <partner-website-url>

  Workflow:
  1. Research the partner's website (WebFetch their URL)
  2. Fetch latest SHI content from https://woody-thicket-86j8.here.now/#vision
  3. Fetch reference ranges from https://opaque-aura-ppk7.here.now/
  4. Replace all {{PLACEHOLDER}} values below with researched content
  5. Publish to here.now via the here-now skill

  Language: Match the partner's primary language (DE for German partners, EN for English)
  Style rules:
  - Dark theme (--bg: #0a0a0f)
  - No emdashes, use " - " instead
  - German text must use proper UTF-8 Umlaute (ü, ö, ä, ß), never ASCII substitutes
  - Use German decimal commas (3,5 not 3.5) when language is DE
  - Partner accent color should complement their brand

  Structure (9 sections, all must have nav anchors):
  01 - Alignment/Synergie (why we fit together)
  02 - Origin Story (the experiment, Fora 6, Qardio Arm, Qardio Base)
  03 - Vision (3 pillars: Sovereign Ownership, Experiment-Driven, Trends)
  04 - 8 Health Zones (106 biomarkers)
  05 - 8 Calculated Markers (with Aware/Fasting/Standard protocol explanation cards)
  06 - Protocol-Aware Reference Ranges (keto table + fasting progression)
  07 - Built for Trust (security, compliance, tech)
  08 - Two Partnership Options (Affiliate + White-Label)
  09 - Live Demo teaser
-->
<!DOCTYPE html>
<html lang="{{LANG: en|de}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sovereign Health x {{PARTNER_NAME}} - {{TITLE: Partnership Proposal|Partnerschaftsvorschlag}}</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --surface2: #1a1a26;
    --border: #2a2a3a;
    --accent: #6366f1;
    --accent2: #818cf8;
    --green: #22c55e;
    --orange: #f59e0b;
    --red: #ef4444;
    --teal: #14b8a6;
    --text: #e2e8f0;
    --text-dim: #94a3b8;
    --partner-color: {{PARTNER_ACCENT_COLOR}};  /* match partner brand */
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    overflow-x: hidden;
  }

  /* NAV - always include logo + all 9 section anchors */
  nav {
    position: fixed; top: 0; width: 100%; z-index: 100;
    background: rgba(10,10,15,0.85);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 0.75rem 2rem;
    display: flex; justify-content: space-between; align-items: center;
  }
  nav .logo {
    display: flex; align-items: center; gap: 0.5rem;
    font-weight: 700; font-size: 1rem; color: var(--accent2);
    letter-spacing: -0.02em; text-decoration: none;
  }
  nav .logo img { width: 24px; height: 24px; }
  nav .nav-links { display: flex; gap: 1rem; flex-wrap: wrap; }
  nav .nav-links a {
    color: var(--text-dim); text-decoration: none; font-size: 0.75rem;
    font-weight: 500; transition: color 0.2s;
  }
  nav .nav-links a:hover { color: var(--accent2); }

  section {
    max-width: 1100px;
    margin: 0 auto;
    padding: 6rem 2rem 4rem;
  }

  .hero {
    min-height: 100vh;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    text-align: center;
    padding-top: 4rem;
    position: relative;
  }
  .hero::before {
    content: '';
    position: absolute;
    top: 20%; left: 50%; transform: translateX(-50%);
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(99,102,241,0.08) 0%, transparent 70%);
    pointer-events: none;
  }

  .badge {
    display: inline-flex; align-items: center; gap: 0.5rem;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 100px; padding: 0.4rem 1rem;
    font-size: 0.75rem; color: var(--accent2); font-weight: 500;
    margin-bottom: 1.5rem;
  }
  .badge .dot { width: 6px; height: 6px; background: var(--green); border-radius: 50%; }

  h1 {
    font-size: clamp(2.2rem, 5vw, 3.8rem);
    font-weight: 800; letter-spacing: -0.03em; line-height: 1.1;
    margin-bottom: 1rem;
  }
  h1 .highlight { color: var(--accent2); }
  h1 .partner { color: var(--partner-color); }

  .hero p {
    font-size: 1.15rem; color: var(--text-dim);
    max-width: 650px; margin-bottom: 2rem;
  }

  h2 {
    font-size: 1.8rem; font-weight: 700; letter-spacing: -0.02em;
    margin-bottom: 0.5rem;
  }
  h2 .num { color: var(--accent); font-weight: 300; margin-right: 0.5rem; }

  .section-sub {
    color: var(--text-dim); font-size: 1rem; max-width: 600px; margin-bottom: 2.5rem;
  }

  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 1.25rem;
  }
  .card-grid-3 { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.75rem;
    transition: border-color 0.3s, transform 0.2s;
  }
  .card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .card .icon { font-size: 1.5rem; margin-bottom: 0.75rem; }
  .card h3 { font-size: 1.05rem; font-weight: 600; margin-bottom: 0.5rem; }
  .card p { font-size: 0.85rem; color: var(--text-dim); line-height: 1.6; }
  .card ul { list-style: none; margin-top: 0.75rem; }
  .card ul li {
    font-size: 0.8rem; color: var(--text-dim);
    padding: 0.25rem 0; padding-left: 1.2rem; position: relative;
  }
  .card ul li::before {
    content: '\2192'; position: absolute; left: 0; color: var(--accent);
  }

  .card.featured {
    border-color: var(--partner-color);
    background: linear-gradient(135deg, var(--surface) 0%, rgba(99,102,241,0.08) 100%);
  }
  .card.featured:hover { border-color: var(--accent); }

  .table-wrap {
    overflow-x: auto; border-radius: 12px;
    border: 1px solid var(--border); margin: 1.5rem 0;
  }
  table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
  thead { background: var(--surface2); }
  th {
    padding: 0.75rem 1rem; text-align: left; font-weight: 600;
    color: var(--text-dim); font-size: 0.7rem;
    text-transform: uppercase; letter-spacing: 0.05em;
    border-bottom: 1px solid var(--border);
  }
  td {
    padding: 0.65rem 1rem;
    border-bottom: 1px solid rgba(42,42,58,0.5);
    color: var(--text);
  }
  tr:hover td { background: rgba(99,102,241,0.04); }
  .tag {
    display: inline-block; padding: 0.15rem 0.5rem;
    border-radius: 4px; font-size: 0.7rem; font-weight: 600;
  }
  .tag-green { background: rgba(34,197,94,0.15); color: var(--green); }
  .tag-orange { background: rgba(245,158,11,0.15); color: var(--orange); }
  .tag-purple { background: rgba(124,58,237,0.15); color: #7c3aed; }

  .zones-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 1rem;
  }
  .zone-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 1.25rem; text-align: center;
    transition: border-color 0.3s;
  }
  .zone-card:hover { border-color: var(--accent); }
  .zone-card .zone-icon { font-size: 1.8rem; margin-bottom: 0.5rem; }
  .zone-card h4 { font-size: 0.9rem; font-weight: 600; margin-bottom: 0.3rem; }
  .zone-card p { font-size: 0.72rem; color: var(--text-dim); }

  .split {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 3rem; align-items: start;
  }
  @media (max-width: 768px) { .split { grid-template-columns: 1fr; } }

  .quote-block {
    border-left: 3px solid var(--partner-color);
    padding: 1.25rem 1.5rem; background: var(--surface);
    border-radius: 0 10px 10px 0; margin: 1.5rem 0;
  }
  .quote-block p { font-style: italic; color: var(--text); font-size: 0.95rem; }
  .quote-block .attr {
    font-style: normal; color: var(--text-dim); font-size: 0.8rem; margin-top: 0.5rem;
  }

  .stats-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 1rem; margin: 2rem 0;
  }
  .stat {
    text-align: center; padding: 1.25rem;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px;
  }
  .stat .num-val {
    font-size: 2rem; font-weight: 800; color: var(--accent2); line-height: 1;
  }
  .stat .label {
    font-size: 0.7rem; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: 0.05em; margin-top: 0.3rem;
  }

  .partnership-options {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 1.5rem; margin-top: 2rem;
  }
  @media (max-width: 768px) { .partnership-options { grid-template-columns: 1fr; } }

  .option-card {
    border-radius: 14px; padding: 2.25rem;
    position: relative; overflow: hidden;
  }
  .option-a {
    background: linear-gradient(135deg, rgba(99,102,241,0.12) 0%, var(--surface) 100%);
    border: 1px solid var(--accent);
  }
  .option-b {
    background: linear-gradient(135deg, rgba(16,185,129,0.1) 0%, var(--surface) 100%);
    border: 1px solid var(--partner-color);
  }
  .option-card .option-label {
    font-size: 0.65rem; text-transform: uppercase;
    letter-spacing: 0.1em; font-weight: 700; margin-bottom: 0.75rem;
  }
  .option-a .option-label { color: var(--accent2); }
  .option-b .option-label { color: var(--partner-color); }
  .option-card h3 { font-size: 1.3rem; font-weight: 700; margin-bottom: 0.75rem; }
  .option-card p { font-size: 0.85rem; color: var(--text-dim); margin-bottom: 1rem; }
  .option-card ul { list-style: none; }
  .option-card ul li {
    font-size: 0.82rem; padding: 0.35rem 0; color: var(--text);
    display: flex; align-items: baseline; gap: 0.5rem;
  }
  .option-card ul li .check { color: var(--green); flex-shrink: 0; }

  .cta-section { text-align: center; padding: 5rem 2rem; }
  .cta-section h2 { font-size: 2.2rem; margin-bottom: 1rem; }
  .cta-badge {
    display: inline-block;
    background: linear-gradient(135deg, var(--accent), var(--partner-color));
    color: white; padding: 0.75rem 2.5rem; border-radius: 100px;
    font-weight: 600; font-size: 1rem; margin-top: 1.5rem;
  }

  .divider {
    width: 60px; height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--partner-color));
    border-radius: 3px; margin: 3rem auto;
  }

  footer {
    text-align: center; padding: 2rem;
    color: var(--text-dim); font-size: 0.7rem;
    border-top: 1px solid var(--border);
  }

  .timeline { position: relative; padding-left: 2rem; }
  .timeline::before {
    content: ''; position: absolute; left: 0.5rem; top: 0; bottom: 0;
    width: 2px; background: var(--border);
  }
  .timeline-item { position: relative; margin-bottom: 1.75rem; }
  .timeline-item::before {
    content: '';
    position: absolute; left: -1.65rem; top: 0.35rem;
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--accent); border: 2px solid var(--bg);
  }
  .timeline-item h4 { font-size: 0.9rem; font-weight: 600; margin-bottom: 0.25rem; }
  .timeline-item p { font-size: 0.8rem; color: var(--text-dim); }

  .protocol-tag {
    display: inline-block; padding: 0.2rem 0.6rem;
    border-radius: 4px; font-size: 0.65rem; font-weight: 600;
    margin: 0.15rem 0.25rem 0.15rem 0;
  }
  .pt-standard { background: rgba(148,163,184,0.15); color: var(--text-dim); }
  .pt-keto { background: rgba(34,197,94,0.15); color: var(--green); }
  .pt-fasting { background: rgba(245,158,11,0.15); color: var(--orange); }
  .pt-extended { background: rgba(239,68,68,0.15); color: var(--red); }
</style>
</head>
<body>

<!--
  TEMPLATE BODY
  =============

  - Section 01: side-by-side "what partner teaches" vs "what SHI provides"
  - Section 05: highlight any calculated marker relevant to partner (e.g. Dr. Boz Ratio)

  After generating, publish via:
  bash ~/.claude/skills/here-now/scripts/publish.sh /tmp/{{slug}}-presentation/ --client claude-code

<nav>
  <a class="logo" href="#"><img src="https://app.sovereignhealth.io/logo.png" alt="Sovereign Health"> Sovereign Health Intelligence</a>
  <div class="nav-links">
    <!-- All 9 sections must have nav anchors -->
    <a href="#alignment">{{NAV_01}}</a>
    <a href="#origin">{{NAV_02}}</a>
    <a href="#vision">{{NAV_03}}</a>
    <a href="#zones">{{NAV_04}}</a>
    <a href="#markers">{{NAV_05}}</a>
    <a href="#ranges">{{NAV_06}}</a>
    <a href="#trust">{{NAV_07}}</a>
    <a href="#partnership">{{NAV_08}}</a>
    <a href="#demo">{{NAV_09}}</a>
  </div>
</nav>

  HERO: Partner name, tagline, 4 stats (106 Biomarkers, 8 Calculated, 6 Protocols, 138 Tests)
  SECTION 01 - ALIGNMENT: Quote block + split comparison + highlight callout

  SECTION 03 - VISION: 3 pillar cards (Sovereign Ownership, Experiment-Driven, Trends)
  SECTION 04 - HEALTH ZONES: 8 zone cards grid
  SECTION 05 - CALCULATED MARKERS: 3 protocol explanation cards (Aware/Fasting/Standard) + marker table
  SECTION 06 - REFERENCE RANGES: Keto table (11 markers) + Fasting progression (glucose + ketones)
  SECTION 07 - TRUST: 3 cards (Security, Compliance, Technology)
  SECTION 08 - PARTNERSHIP: 2 option cards (Affiliate + White-Label), tailored to partner
  SECTION 09 - DEMO: CTA with live demo teaser + pricing stats
  FOOTER: sovereignhealth.io + partner name + date
-->

</body>
</html>
