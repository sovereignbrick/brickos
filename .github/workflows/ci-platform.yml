name: Platform CI

on:
  push:
    paths: ['crates/**', 'tests/**']
    branches: [develop, main]
  pull_request:
    paths: ['crates/**', 'tests/**']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p brickos-auth -p brickos-crypto -p brickos-db
