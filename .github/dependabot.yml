version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [shared, dependencies]
    open-pull-requests-limit: 5
    groups:
      rust-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /apps/health/sovereign-health/frontend
    schedule:
      interval: weekly
      day: monday
    labels: [app:health, dependencies]
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [shared, dependencies]
    groups:
      actions-all:
        patterns: ["*"]
