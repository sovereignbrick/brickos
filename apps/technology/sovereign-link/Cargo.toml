[package]
name = "sovereign-link"
version = "0.2.0"
edition = "2021"
description = "Sovereign Link — URL shortener, service gateway, and affiliate link platform"
license = "AGPL-3.0"

[features]
default = ["platform"]
standalone = ["rusqlite", "r2d2", "dep:argon2", "dep:jsonwebtoken", "dep:tracing-subscriber", "dep:secp256k1", "dep:askama", "dep:toml", "dep:tokio-tungstenite", "dep:futures-util", "dep:reqwest"]
platform = []

[dependencies]
actix-web = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
sha2 = "0.10"
hex = "0.4"
rand = "0.9"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
async-trait = "0.1"
url = "2"

# Standalone mode
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
r2d2 = { version = "0.8", optional = true }
argon2 = { workspace = true, optional = true }
jsonwebtoken = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
secp256k1 = { version = "0.30", optional = true, features = ["global-context"] }
askama = { version = "0.12", optional = true }
toml = { version = "0.8", optional = true }
tokio-tungstenite = { version = "0.24", optional = true, features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", optional = true }
reqwest = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
actix-http = "3"
