# BrickOS Status Page -- nginx proxy in front of Gatus
# Injects BrickOS branding CSS, favicon, and custom header.

server {
    listen 80;

    # Proxy everything to Gatus
    location / {
        proxy_pass http://gatus-upstream:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable compression so sub_filter works
        proxy_set_header Accept-Encoding "";

        # Inject BrickOS branding CSS before </head>
        sub_filter '</head>' '
          <link rel="icon" type="image/png" href="/brickos/favicon-32.png">
          <style>
            /* BrickOS branding override */
            body { background-color: #09090b !important; }
            .bg-gray-900, [class*="bg-gray-9"] { background-color: #09090b !important; }
            .bg-gray-800, [class*="bg-gray-8"] { background-color: #18181b !important; }

            /* Replace Gatus logo with BrickOS cube */
            img[alt*="Gatus"], img[src*="logo"], .logo img,
            header img, nav img { display: none !important; }

            /* Add BrickOS cube before header text */
            header, .container > div:first-child {
              position: relative;
            }

            /* Override green accent to BrickOS orange where possible */
            .text-green-600 { color: #f97316 !important; }
            a { color: #60a5fa !important; }

            /* Dark theme text */
            .text-gray-400 { color: #a1a1aa !important; }
            .text-gray-500 { color: #71717a !important; }

            /* Cards */
            .rounded-xl, .rounded-lg { border-color: #27272a !important; }
          </style>
        </head>';

        # Replace title
        sub_filter '<title>' '<title>BrickOS Platform Status - ';
        sub_filter_types text/html;
        sub_filter_once off;
    }

    # Serve BrickOS static assets
    location /brickos/ {
        alias /usr/share/nginx/html/brickos/;
        expires 30d;
    }
}
