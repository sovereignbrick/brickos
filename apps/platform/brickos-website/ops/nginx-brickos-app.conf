# ============================================================================
# BrickOS Platform App — app.brickos.io / demo.brickos.io / api.brickos.io
# Routes to the same SHI frontend/backend containers.
# Platform admin GUI lives at /platform/ on these domains.
# ============================================================================

# ── Production App (frontend) ────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name app.brickos.io;

    ssl_certificate /etc/ssl/cloudflare/brickos.io.pem;
    ssl_certificate_key /etc/ssl/cloudflare/brickos.io.key;

    include /etc/nginx/snippets/security-headers.conf;
    proxy_hide_header X-Powered-By;
    proxy_read_timeout 120s;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── Production API ───────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name api.brickos.io;

    ssl_certificate /etc/ssl/cloudflare/brickos.io.pem;
    ssl_certificate_key /etc/ssl/cloudflare/brickos.io.key;

    include /etc/nginx/snippets/security-headers.conf;
    proxy_hide_header X-Powered-By;
    proxy_read_timeout 120s;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
    }
}

# ── Staging App (frontend) ───────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name demo.brickos.io;

    ssl_certificate /etc/ssl/cloudflare/brickos.io.pem;
    ssl_certificate_key /etc/ssl/cloudflare/brickos.io.key;

    include /etc/nginx/snippets/security-headers.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;
    proxy_hide_header X-Powered-By;

    # Basic auth (same as demo.sovereignhealth.io)
    auth_basic "Staging Access";
    auth_basic_user_file /etc/nginx/.htpasswd;

    proxy_read_timeout 120s;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── HTTP → HTTPS redirects ───────────────────────────────────────────────────
server {
    listen 80;
    server_name app.brickos.io demo.brickos.io api.brickos.io;
    return 301 https://$host$request_uri;
}
