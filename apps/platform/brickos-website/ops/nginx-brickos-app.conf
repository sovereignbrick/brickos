# ============================================================================
# BrickOS Platform App -- app.brickos.io / demo.brickos.io / api.brickos.io
# ============================================================================

# ── Production App ───────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name app.brickos.io;

    ssl_certificate /etc/ssl/cloudflare/brickos.io.pem;
    ssl_certificate_key /etc/ssl/cloudflare/brickos.io.key;

    include /etc/nginx/snippets/security-headers.conf;
    proxy_hide_header X-Powered-By;
    proxy_read_timeout 120s;

    # Sprint 043 #526: proxy ALL backend route prefixes to production backend.
    # Covers /api, /auth, /admin, /zones, /measurements, /doctor-chat, etc.
    location ~ ^/(api|auth|admin|zones|measurements|markers|user-markers|user-medications|trends|devices|settings|doctor-chat|import|export|reports|license|billing|donate|demo|influence-factors|medications|measurement-templates|knowledge|labs|push|sync|health|v1|r)(/|$) {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Org-Domain $host;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        client_max_body_size 35m;
        proxy_read_timeout 120s;
    }

    # /sovereignhealth/ -> SHI app (strip prefix)
    location /sovereignhealth/ {
        rewrite ^/sovereignhealth/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /sovereignhealth { return 302 /sovereignhealth/; }

    # Future apps (redirect to platform for now)
    location = /sovereignlink { return 302 /platform/links; }
    location = /sovereignvoice { return 302 /platform/apps; }

    # Default: redirect root to platform, proxy everything else to frontend
    location = / { return 302 /platform; }

    # Sprint 042 #538: SW JS must be no-cache so production deploys
    # actually roll out to returning users.
    location = /sw.js {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── Production API (legacy subdomain -- kept for backward compatibility) ─────
# D1 decision: path mount is canonical (app.brickos.io/api/v1/...).
# api.brickos.io still works but is deprecated. Clients should migrate
# to the path-mount to avoid CORS preflight overhead.
server {
    listen 443 ssl http2;
    server_name api.brickos.io;

    ssl_certificate /etc/ssl/cloudflare/brickos.io.pem;
    ssl_certificate_key /etc/ssl/cloudflare/brickos.io.key;

    include /etc/nginx/snippets/security-headers.conf;
    proxy_hide_header X-Powered-By;
    proxy_read_timeout 120s;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
    }
}

# ── Staging API (legacy subdomain -- kept for backward compatibility) ────────
server {
    listen 443 ssl http2;
    server_name api-demo.brickos.io;

    ssl_certificate /etc/ssl/cloudflare/brickos.io.pem;
    ssl_certificate_key /etc/ssl/cloudflare/brickos.io.key;

    include /etc/nginx/snippets/security-headers.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;
    proxy_hide_header X-Powered-By;
    proxy_read_timeout 120s;

    auth_basic "Staging Access";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
    }
}

# ── Staging App ──────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name demo.brickos.io;

    ssl_certificate /etc/ssl/cloudflare/brickos.io.pem;
    ssl_certificate_key /etc/ssl/cloudflare/brickos.io.key;

    include /etc/nginx/snippets/security-headers.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;
    proxy_hide_header X-Powered-By;

    auth_basic "Staging Access";
    auth_basic_user_file /etc/nginx/.htpasswd;

    proxy_read_timeout 120s;

    # Sprint 043 #526: proxy ALL backend route prefixes to staging backend.
    # auth_basic off -- backend handles JWT auth via its own middleware.
    # This single regex replaces individual /api/, /auth/, /admin/ blocks
    # and covers all backend scopes (/zones, /measurements, /doctor-chat, etc.)
    location ~ ^/(api|auth|admin|zones|measurements|markers|user-markers|user-medications|trends|devices|settings|doctor-chat|import|export|reports|license|billing|donate|demo|influence-factors|medications|measurement-templates|knowledge|labs|push|sync|health|v1|r)(/|$) {
        auth_basic off;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Org-Domain $host;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        client_max_body_size 35m;
        proxy_read_timeout 120s;
    }

    # /sovereignhealth/ -> staging SHI (strip prefix)
    location /sovereignhealth/ {
        rewrite ^/sovereignhealth/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /sovereignhealth { return 302 /sovereignhealth/; }

    location = /sovereignlink { return 302 /platform/links; }
    location = /sovereignvoice { return 302 /platform/apps; }

    # Root -> platform
    location = / { return 302 /platform; }

    # Sprint 042 #538: SW JS must be no-cache + bypass basic auth
    # (browsers can't authenticate the SW registration request).
    location = /sw.js {
        auth_basic off;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Catch-all: proxy everything to staging frontend (handles /platform, /dashboard, etc.)
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── Gatus Status Page ────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name status.brickos.io;

    ssl_certificate /etc/ssl/cloudflare/brickos.io.pem;
    ssl_certificate_key /etc/ssl/cloudflare/brickos.io.key;

    include /etc/nginx/snippets/security-headers.conf;

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Disable gzip so sub_filter can modify HTML
        proxy_set_header Accept-Encoding "";

        # BrickOS branding injection
        sub_filter '</head>' '<link rel="icon" type="image/png" href="data:image/png;base64,">
          <style>
            body, html { background: #09090b !important; }
            [class*="bg-gray-9"], [class*="dark:bg-gray-9"] { background: #09090b !important; }
            [class*="bg-gray-8"], [class*="dark:bg-gray-8"] { background: #18181b !important; }
            [class*="bg-green-6"] { background: #f97316 !important; }
            img[alt*="logo" i], img[alt*="gatus" i], svg.w-10 { opacity: 0 !important; width: 0 !important; }
          </style></head>';
        sub_filter 'Gatus' 'BrickOS';
        sub_filter '/favicon-32x32.png' '/brickos/favicon-32.png';
        sub_filter '/favicon-16x16.png' '/brickos/favicon-32.png';
        sub_filter '/apple-touch-icon.png' '/brickos/favicon-32.png';
        sub_filter_types text/html;
        sub_filter_once off;
    }

    # Serve BrickOS branded assets for Gatus
    location /brickos/ {
        root /opt/brickos/gatus-assets;
        expires 30d;
    }
}

# ── White-Label Org Subdomains (catch-all) ──────────────────────────────────
# Sprint 044 #544: Any {slug}.brickos.io not matched by a specific server
# block above lands here. Routes to production backend + frontend, passing
# X-Org-Domain so the org_resolver middleware can identify the org.
# Specific subdomains (app, demo, api, api-demo, status) take priority.
server {
    listen 443 ssl http2;
    server_name *.brickos.io;

    ssl_certificate /etc/ssl/cloudflare/brickos.io.pem;
    ssl_certificate_key /etc/ssl/cloudflare/brickos.io.key;

    include /etc/nginx/snippets/security-headers.conf;
    proxy_hide_header X-Powered-By;
    proxy_read_timeout 120s;

    # Backend routes -- same regex as app.brickos.io production block
    location ~ ^/(api|auth|admin|zones|measurements|markers|user-markers|user-medications|trends|devices|settings|doctor-chat|import|export|reports|license|billing|donate|demo|influence-factors|medications|measurement-templates|knowledge|labs|push|sync|health|v1|r)(/|$) {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Org-Domain $host;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        client_max_body_size 35m;
        proxy_read_timeout 120s;
    }

    # SW JS -- no-cache for deploy rollout
    location = /sw.js {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Frontend catch-all -- serves login page, dashboard, etc.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Org-Domain $host;
    }
}

# ── HTTP -> HTTPS ────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name app.brickos.io demo.brickos.io api.brickos.io api-demo.brickos.io status.brickos.io *.brickos.io;
    return 301 https://$host$request_uri;
}
