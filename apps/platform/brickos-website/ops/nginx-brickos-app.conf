# ── Staging App ──────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name demo.brickos.io;

    ssl_certificate /etc/ssl/cloudflare/brickos.io.pem;
    ssl_certificate_key /etc/ssl/cloudflare/brickos.io.key;

    include /etc/nginx/snippets/security-headers.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;
    proxy_hide_header X-Powered-By;

    auth_basic "Staging Access";
    auth_basic_user_file /etc/nginx/.htpasswd;

    proxy_read_timeout 120s;

    # Sprint 043 #526: proxy ALL backend route prefixes to staging backend.
    # Sprint 047 #585: Accept-header + RSC-header fallback for browser
    # navigation (see #556 on wildcard blocks + production app.brickos.io).
    location ~ ^/(api|auth|admin|zones|measurements|markers|user-markers|user-medications|trends|devices|settings|doctor-chat|practitioner|org-settings|import|export|reports|license|billing|donate|demo|influence-factors|medications|measurement-templates|knowledge|labs|push|sync|health|v1|r)(/|$) {
        auth_basic off;
        if ($http_accept ~* "text/html") {
            rewrite ^ /__fe_navigate$uri last;
        }
        if ($http_rsc = "1") {
            rewrite ^ /__fe_navigate$uri last;
        }
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Org-Domain $host;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        client_max_body_size 35m;
        proxy_read_timeout 120s;
    }

    # Sprint 047 #585: internal frontend fallback for browser navigations.
    location /__fe_navigate {
        internal;
        auth_basic off;
        rewrite ^/__fe_navigate(.*)$ $1 break;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /sovereignhealth/ -> staging SHI (strip prefix)
    location /sovereignhealth/ {
        rewrite ^/sovereignhealth/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /sovereignhealth { return 302 /sovereignhealth/; }

    location = /sovereignlink { return 302 /platform/links; }
    location = /sovereignvoice { return 302 /platform/apps; }

    # Root -> platform
    location = / { return 302 /platform; }

    # Sprint 042 #538: SW JS must be no-cache + bypass basic auth
    # (browsers can't authenticate the SW registration request).
    location = /sw.js {
        auth_basic off;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Catch-all: proxy everything to staging frontend (handles /platform, /dashboard, etc.)
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── Gatus Status Page ────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name status.brickos.io;

    ssl_certificate /etc/ssl/cloudflare/brickos.io.pem;
    ssl_certificate_key /etc/ssl/cloudflare/brickos.io.key;

    include /etc/nginx/snippets/security-headers.conf;

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Disable gzip so sub_filter can modify HTML
        proxy_set_header Accept-Encoding "";

        # BrickOS branding injection
        sub_filter '</head>' '<link rel="icon" type="image/png" href="data:image/png;base64,">
          <style>
            body, html { background: #09090b !important; }
            [class*="bg-gray-9"], [class*="dark:bg-gray-9"] { background: #09090b !important; }
            [class*="bg-gray-8"], [class*="dark:bg-gray-8"] { background: #18181b !important; }
            [class*="bg-green-6"] { background: #f97316 !important; }
            img[alt*="logo" i], img[alt*="gatus" i], svg.w-10 { opacity: 0 !important; width: 0 !important; }
          </style></head>';
        sub_filter 'Gatus' 'BrickOS';
        sub_filter '/favicon-32x32.png' '/brickos/favicon-32.png';
        sub_filter '/favicon-16x16.png' '/brickos/favicon-32.png';
        sub_filter '/apple-touch-icon.png' '/brickos/favicon-32.png';
        sub_filter_types text/html;
        sub_filter_once off;
    }

    # Serve BrickOS branded assets for Gatus
    location /brickos/ {
        root /opt/brickos/gatus-assets;
        expires 30d;
    }
}

# ── White-Label Org Subdomains (catch-all) ──────────────────────────────────
# Sprint 044 #544: Any {slug}.brickos.io not matched by a specific server
# block above lands here. Routes to production backend + frontend, passing
# X-Org-Domain so the org_resolver middleware can identify the org.
# Specific subdomains (app, demo, api, api-demo, status) take priority.
server {
    listen 443 ssl http2;
    server_name *.brickos.io;

    ssl_certificate /etc/ssl/cloudflare/brickos.io.pem;
    ssl_certificate_key /etc/ssl/cloudflare/brickos.io.key;

    include /etc/nginx/snippets/security-headers.conf;
    proxy_hide_header X-Powered-By;
    proxy_read_timeout 120s;

    # Backend routes -- same regex as app.brickos.io production block.
    # #556: frontend ALSO has pages at /admin, /settings, /zones, /markers,
    # /measurements, /trends, /doctor-chat, /donate, /billing, /practitioner
    # (SHI is at root on wildcard org domains, unlike app.brickos.io where
    # it's at /sovereignhealth/). If the request is a browser navigation
    # (Accept: text/html) we route to the frontend; XHR / API calls continue
    # to the backend.
    location ~ ^/(api|auth|admin|zones|measurements|markers|user-markers|user-medications|trends|devices|settings|doctor-chat|practitioner|org-settings|import|export|reports|license|billing|donate|demo|influence-factors|medications|measurement-templates|knowledge|labs|push|sync|health|v1|r)(/|$) {
        # Sprint 046 #579/#580 hotfix: HTML nav + Next.js RSC prefetches.
        if ($http_accept ~* "text/html") {
            rewrite ^ /__fe_navigate$uri last;
        }
        if ($http_rsc = "1") {
            rewrite ^ /__fe_navigate$uri last;
        }
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Org-Domain $host;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        client_max_body_size 35m;
        proxy_read_timeout 120s;
    }

    # #556: internal fallback for browser navigations to backend-regex paths.
    # Strips the /__fe_navigate prefix and proxies to the frontend.
    location /__fe_navigate {
        internal;
        rewrite ^/__fe_navigate(.*)$ $1 break;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Org-Domain $host;
    }

    # SW JS -- no-cache for deploy rollout
    location = /sw.js {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Frontend catch-all -- serves login page, dashboard, etc.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Org-Domain $host;
    }
}

# ── White-Label Org Subdomains -- STAGING (catch-all) ───────────────────────
# Sprint 044 RC fix: staging RC testing of white-label needs org subdomains
# pointing at the STAGING ports (3001/8081), not production. Using the
# {slug}.demo.brickos.io pattern keeps the wildcard one label deep so the
# Cloudflare origin cert (reissued with *.demo.brickos.io SAN) still matches.
# auth_basic is OFF -- per-tenant logins must work without staging credentials.
# X-Robots-Tag noindex -- staging must not be indexed.
server {
    listen 443 ssl http2;
    server_name *.demo.brickos.io;

    # Sprint 044 RC: Cloudflare's free Universal SSL doesn't cover deeper
    # wildcards (*.demo.brickos.io), so this wildcard is DNS-only at Cloudflare
    # (grey cloud) and we serve a Let's Encrypt wildcard cert directly from
    # nginx. Renewal is via certbot DNS-01 (cloudflare plugin).
    ssl_certificate /etc/letsencrypt/live/demo.brickos.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.brickos.io/privkey.pem;

    include /etc/nginx/snippets/security-headers.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;
    proxy_hide_header X-Powered-By;
    proxy_read_timeout 120s;

    # Backend routes -- proxy to STAGING backend (8081).
    # #556: frontend ALSO has pages at /admin, /settings, /zones, /markers,
    # /measurements, /trends, /doctor-chat, /donate, /billing, /practitioner.
    # Browser navigation (Accept: text/html) -> frontend; XHR / API -> backend.
    location ~ ^/(api|auth|admin|zones|measurements|markers|user-markers|user-medications|trends|devices|settings|doctor-chat|practitioner|org-settings|import|export|reports|license|billing|donate|demo|influence-factors|medications|measurement-templates|knowledge|labs|push|sync|health|v1|r)(/|$) {
        # Sprint 046 #579/#580 hotfix: HTML nav + Next.js RSC prefetches.
        if ($http_accept ~* "text/html") {
            rewrite ^ /__fe_navigate$uri last;
        }
        if ($http_rsc = "1") {
            rewrite ^ /__fe_navigate$uri last;
        }
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Org-Domain $host;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        client_max_body_size 35m;
        proxy_read_timeout 120s;
    }

    # #556: internal fallback for browser navigations to backend-regex paths.
    location /__fe_navigate {
        internal;
        rewrite ^/__fe_navigate(.*)$ $1 break;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Org-Domain $host;
    }

    # SW JS -- no-cache for deploy rollout
    location = /sw.js {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Frontend catch-all -- proxy to STAGING frontend (3001)
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Org-Domain $host;
    }
}

# ── HTTP -> HTTPS ────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name app.brickos.io demo.brickos.io api.brickos.io api-demo.brickos.io status.brickos.io *.brickos.io *.demo.brickos.io;
    return 301 https://$host$request_uri;
}
