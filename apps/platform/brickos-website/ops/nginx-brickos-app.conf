# ============================================================================
# BrickOS Platform App -- app.brickos.io / demo.brickos.io / api.brickos.io
# ============================================================================

# ── Production App ───────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name app.brickos.io;

    ssl_certificate /etc/ssl/cloudflare/brickos.io.pem;
    ssl_certificate_key /etc/ssl/cloudflare/brickos.io.key;

    include /etc/nginx/snippets/security-headers.conf;
    proxy_hide_header X-Powered-By;
    proxy_read_timeout 120s;

    # /api/ -> proxy API calls through same origin (avoids cross-origin blocks)
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
    }

    # /auth/ -> proxy auth calls through same origin
    location /auth/ {
        proxy_pass http://127.0.0.1:8080/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /admin/ -> proxy admin API calls through same origin
    location /admin/ {
        proxy_pass http://127.0.0.1:8080/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /sovereignhealth/ -> SHI app (strip prefix)
    location /sovereignhealth/ {
        rewrite ^/sovereignhealth/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /sovereignhealth { return 302 /sovereignhealth/; }

    # Future apps (redirect to platform for now)
    location = /sovereignlink { return 302 /platform/links; }
    location = /sovereignvoice { return 302 /platform/apps; }

    # Default: redirect root to platform, proxy everything else to frontend
    location = / { return 302 /platform; }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── Production API ───────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name api.brickos.io;

    ssl_certificate /etc/ssl/cloudflare/brickos.io.pem;
    ssl_certificate_key /etc/ssl/cloudflare/brickos.io.key;

    include /etc/nginx/snippets/security-headers.conf;
    proxy_hide_header X-Powered-By;
    proxy_read_timeout 120s;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
    }
}

# ── Staging App ──────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name demo.brickos.io;

    ssl_certificate /etc/ssl/cloudflare/brickos.io.pem;
    ssl_certificate_key /etc/ssl/cloudflare/brickos.io.key;

    include /etc/nginx/snippets/security-headers.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;
    proxy_hide_header X-Powered-By;

    auth_basic "Staging Access";
    auth_basic_user_file /etc/nginx/.htpasswd;

    proxy_read_timeout 120s;

    # /sovereignhealth/ -> staging SHI (strip prefix)
    location /sovereignhealth/ {
        rewrite ^/sovereignhealth/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /sovereignhealth { return 302 /sovereignhealth/; }

    location = /sovereignlink { return 302 /platform/links; }
    location = /sovereignvoice { return 302 /platform/apps; }

    # Root -> platform
    location = / { return 302 /platform; }

    # Catch-all: proxy everything to staging frontend (handles /platform, /dashboard, etc.)
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── Gatus Status Page ────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name status.brickos.io;

    ssl_certificate /etc/ssl/cloudflare/brickos.io.pem;
    ssl_certificate_key /etc/ssl/cloudflare/brickos.io.key;

    include /etc/nginx/snippets/security-headers.conf;

    # Inject BrickOS branding CSS into Gatus HTML responses
    sub_filter '</head>' '<style>
      .logo-container img, .logo-container svg { display:none !important; }
      .logo-container::before { content:"\25A0"; font-size:2rem; color:#f97316; margin-right:0.5rem; }
      h1.text-3xl { font-size:1.5rem !important; }
      h1.text-3xl::after { content:" "; }
    </style></head>';
    sub_filter_once on;
    sub_filter_types text/html;

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
    }
}

# ── HTTP -> HTTPS ────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name app.brickos.io demo.brickos.io api.brickos.io status.brickos.io;
    return 301 https://$host$request_uri;
}
