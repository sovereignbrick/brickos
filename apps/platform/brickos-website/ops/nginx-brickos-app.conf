# ============================================================================
# BrickOS Platform App -- app.brickos.io / demo.brickos.io / api.brickos.io
# ============================================================================

# ── Production App ───────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name app.brickos.io;

    ssl_certificate /etc/ssl/cloudflare/brickos.io.pem;
    ssl_certificate_key /etc/ssl/cloudflare/brickos.io.key;

    include /etc/nginx/snippets/security-headers.conf;
    proxy_hide_header X-Powered-By;
    proxy_read_timeout 120s;

    # Sprint 043 #526: proxy ALL backend route prefixes to production backend.
    # Sprint 047 #585: Accept-header + RSC-header fallback so browser
    # navigation to path-mount paths (e.g. /admin) routes to the frontend
    # Next.js redirects instead of returning backend 404. Matches the
    # wildcard block's #556 fix.
    location ~ ^/(api|auth|admin|zones|measurements|markers|user-markers|user-medications|trends|devices|settings|doctor-chat|practitioner|org-settings|import|export|reports|license|billing|donate|demo|influence-factors|medications|measurement-templates|knowledge|labs|push|sync|health|v1|r)(/|$) {
        if ($http_accept ~* "text/html") {
            rewrite ^ /__fe_navigate$uri last;
        }
        if ($http_rsc = "1") {
            rewrite ^ /__fe_navigate$uri last;
        }
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Org-Domain $host;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        client_max_body_size 35m;
        proxy_read_timeout 120s;
    }

    # Sprint 047 #585: internal frontend fallback for browser navigations.
    location /__fe_navigate {
        internal;
        rewrite ^/__fe_navigate(.*)$ $1 break;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /sovereignhealth/ -> SHI app (strip prefix)
    location /sovereignhealth/ {
        rewrite ^/sovereignhealth/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /sovereignhealth { return 302 /sovereignhealth/; }

    # Future apps (redirect to platform for now)
    location = /sovereignlink { return 302 /platform/links; }
    location = /sovereignvoice { return 302 /platform/apps; }

    # Default: redirect root to platform, proxy everything else to frontend
    location = / { return 302 /platform; }

    # Sprint 042 #538: SW JS must be no-cache so production deploys
    # actually roll out to returning users.
    location = /sw.js {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── Production API (legacy subdomain -- kept for backward compatibility) ─────
# D1 decision: path mount is canonical (app.brickos.io/api/v1/...).
# api.brickos.io still works but is deprecated. Clients should migrate
# to the path-mount to avoid CORS preflight overhead.
server {
    listen 443 ssl http2;
    server_name api.brickos.io;

    ssl_certificate /etc/ssl/cloudflare/brickos.io.pem;
    ssl_certificate_key /etc/ssl/cloudflare/brickos.io.key;

    include /etc/nginx/snippets/security-headers.conf;
    proxy_hide_header X-Powered-By;
    proxy_read_timeout 120s;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
    }
}

