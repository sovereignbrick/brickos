name: scr-prod

services:
  scr-api:
    image: sovereignbrick/scr-api:${VERSION:-0.1.0}
    container_name: scr-api
    restart: unless-stopped
    ports:
      - "8084:8084"
    env_file: ../api/.env.production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  scr-web:
    image: sovereignbrick/scr-web:${VERSION:-0.1.0}
    container_name: scr-web
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
