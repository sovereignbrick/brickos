name: scr-dev

services:
  scr-db:
    image: postgres:16-alpine
    container_name: scr-dev-db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: brickos
      POSTGRES_PASSWORD: brickos
      POSTGRES_DB: scr
    volumes:
      - scr-dev-data:/var/lib/postgresql/data
      - ./init-dev-db.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brickos -d scr"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  scr-dev-data:
