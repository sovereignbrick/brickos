# ══════════════════════════════════════════════════════════════════════════════
# STAGING -- All staging URLs are behind basic auth
# ══════════════════════════════════════════════════════════════════════════════

# ── Staging App (frontend on :3001) ──────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name demo.sovereignhealth.io;

    ssl_certificate /etc/letsencrypt/live/sovereignhealth.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sovereignhealth.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/security-headers.conf;
    add_header Onion-Location http://4ikzwwyopd5lpv7d2bxtmfddgwr2f3i4au3zevbdj4zbwurcckb7vsqd.onion$request_uri always;
    add_header X-Robots-Tag "noindex, nofollow, noai, noimageai" always;
    proxy_hide_header X-Powered-By;

    # Basic auth -- prevents public access to staging
    auth_basic "Staging Access";
    auth_basic_user_file /etc/nginx/.htpasswd;

    proxy_read_timeout 120s;

    # PWA files must bypass basic auth (service worker + iOS can't authenticate)
    location = /manifest.json {
        auth_basic off;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
    }
    location = /sw.js {
        auth_basic off;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        # Sprint 042 #538 fix: SW JS must be no-cache so deploys actually
        # roll out to returning users. Override whatever the upstream
        # Next.js handler sets (it defaults to public, max-age=14400).
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        # Re-include security headers because location-level add_header
        # otherwise shadows the server-level snippet (nginx inheritance rule).
        include /etc/nginx/snippets/security-headers.conf;
    }
    location = /offline {
        auth_basic off;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # PWA icons must bypass basic auth for iOS home screen icon
    location ~ ^/(android-chrome-|apple-touch-icon|favicon|logo\.png) {
        auth_basic off;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
    }

    # Sprint 047 #577 Phase C: legacy SHI root paths -> /sovereign-health/*.
    # Browser nav only (text/html or RSC: 1). Runs before location matching.
    set $shi_nav "";
    if ($http_accept ~* "text/html") { set $shi_nav "1"; }
    if ($http_rsc = "1")              { set $shi_nav "1"; }
    if ($shi_nav) {
        rewrite ^/(dashboard|measurements|doctor-chat|markers|trends|zones|practitioner)(/.*)?$ /sovereign-health/$1$2 last;
    }

    # Sprint 047 RC fix 2026-04-20: path-mount to the staging backend
    # (port 8081). Historical comment said "no path-mount here because
    # /admin collides with the SHI admin page" -- that page was deleted
    # in Sprint 046 so the objection no longer applies. Without this
    # block, /api/auth/login and every other same-origin API call 404s
    # (returned by the frontend), breaking the login form on
    # demo.sovereignhealth.io. Same #556/#580 Accept-header + RSC
    # fallback as the wildcard blocks.
    location ~ ^/(api|auth|admin|zones|measurements|markers|user-markers|user-medications|user|trends|devices|settings|doctor-chat|practitioner|org-settings|signup|import|export|reports|license|billing|donate|demo|influence-factors|medications|measurement-templates|knowledge|labs|push|sync|health|v1|r)(/|$) {
        # Sprint 047 RC fix: path-mount skips basic auth. XHRs from the
        # logged-in frontend set Authorization: Bearer <JWT>, which
        # browsers can't combine with Basic auth in one Authorization
        # header. Without this, every authed API call 401s at nginx
        # before reaching the backend. Mirrors demo.brickos.io.
        auth_basic off;
        if ($http_accept ~* "text/html") {
            rewrite ^ /__fe_navigate$uri last;
        }
        if ($http_rsc = "1") {
            rewrite ^ /__fe_navigate$uri last;
        }
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Org-Domain $host;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        client_max_body_size 35m;
        proxy_read_timeout 120s;
    }

    location /__fe_navigate {
        internal;
        auth_basic off;
        rewrite ^/__fe_navigate(.*)$ $1 break;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

