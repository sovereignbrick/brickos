# brickos.io (nginx-brickos-app.conf). Design 025 has the full architecture.
# Specific subdomains (app, api, demo, api-demo, www, www-demo, dev) take
# priority over these wildcards.
# ══════════════════════════════════════════════════════════════════════════════

# ── *.sovereignhealth.io (production wildcard) ───────────────────────────────
# LE wildcard cert issued via DNS-01 (Cloudflare plugin, #560).
# Same-origin path-mount like app.brickos.io + *.brickos.io. Browser
# HTML navigation to colliding paths falls through to the frontend via
# the #556 Accept-header fix.
