# ══════════════════════════════════════════════════════════════════════════════
# PRODUCTION
# ══════════════════════════════════════════════════════════════════════════════

# ── Production Website (static) ──────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name sovereignhealth.io www.sovereignhealth.io;

    ssl_certificate /etc/letsencrypt/live/sovereignhealth.io-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sovereignhealth.io-0001/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/sovereign-health/homepage;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;
    add_header Onion-Location http://4ikzwwyopd5lpv7d2bxtmfddgwr2f3i4au3zevbdj4zbwurcckb7vsqd.onion$request_uri always;

    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# ── Production App (frontend) ────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name app.sovereignhealth.io;

    ssl_certificate /etc/letsencrypt/live/sovereignhealth.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sovereignhealth.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/security-headers.conf;
    add_header Onion-Location http://4ikzwwyopd5lpv7d2bxtmfddgwr2f3i4au3zevbdj4zbwurcckb7vsqd.onion$request_uri always;
    add_header X-Robots-Tag "noai, noimageai" always;
    proxy_hide_header X-Powered-By;

    proxy_read_timeout 120s;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── Production API (backend) ─────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name api.sovereignhealth.io;

    ssl_certificate /etc/letsencrypt/live/sovereignhealth.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sovereignhealth.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/security-headers.conf;
    add_header Onion-Location http://4ikzwwyopd5lpv7d2bxtmfddgwr2f3i4au3zevbdj4zbwurcckb7vsqd.onion$request_uri always;
    server_tokens off;

    client_max_body_size 35m;
    proxy_read_timeout 120s;
    proxy_connect_timeout 10s;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ══════════════════════════════════════════════════════════════════════════════
# STAGING -- All staging URLs are behind basic auth
# ══════════════════════════════════════════════════════════════════════════════

# ── Staging App (frontend on :3001) ──────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name demo.sovereignhealth.io;

    ssl_certificate /etc/letsencrypt/live/sovereignhealth.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sovereignhealth.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/security-headers.conf;
    add_header Onion-Location http://4ikzwwyopd5lpv7d2bxtmfddgwr2f3i4au3zevbdj4zbwurcckb7vsqd.onion$request_uri always;
    add_header X-Robots-Tag "noindex, nofollow, noai, noimageai" always;
    proxy_hide_header X-Powered-By;

    # Basic auth -- prevents public access to staging
    auth_basic "Staging Access";
    auth_basic_user_file /etc/nginx/.htpasswd;

    proxy_read_timeout 120s;

    # PWA files must bypass basic auth (service worker can't authenticate)
    location = /manifest.json {
        auth_basic off;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
    }
    location = /sw.js {
        auth_basic off;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
    }
    location = /offline {
        auth_basic off;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

