# ══════════════════════════════════════════════════════════════════════════════
# PRODUCTION
# ══════════════════════════════════════════════════════════════════════════════

# ── Production Website (static) ──────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name sovereignhealth.io www.sovereignhealth.io;

    ssl_certificate /etc/letsencrypt/live/sovereignhealth.io-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sovereignhealth.io-0001/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/sovereign-health/homepage;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;
    add_header Onion-Location http://4ikzwwyopd5lpv7d2bxtmfddgwr2f3i4au3zevbdj4zbwurcckb7vsqd.onion$request_uri always;

    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# ── Production App (frontend + same-origin backend) ──────────────────────────
# Sprint 045 #562: migrated to same-origin path-mount. Backend routes go to
# :8080 on the same hostname; #556 Accept-header fix routes browser
# navigation of /admin, /settings, etc. to the frontend.
server {
    listen 443 ssl http2;
    server_name app.sovereignhealth.io;

    ssl_certificate /etc/letsencrypt/live/sovereignhealth.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sovereignhealth.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/security-headers.conf;
    add_header Onion-Location http://4ikzwwyopd5lpv7d2bxtmfddgwr2f3i4au3zevbdj4zbwurcckb7vsqd.onion$request_uri always;
    add_header X-Robots-Tag "noai, noimageai" always;
    proxy_hide_header X-Powered-By;

    proxy_read_timeout 120s;
    client_max_body_size 35m;

    # Sprint 047 #577 Phase C: legacy SHI root paths map to /sovereign-health/*
    # on this branded domain. Conditional on browser navigation (text/html) or
    # RSC prefetch (RSC: 1) so JSON API calls (Accept: */*) keep going to the
    # backend unchanged. The rewrite runs at server level before location
    # matching so Next.js receives the prefixed URI; the browser URL bar
    # stays clean at e.g. sovereignhealth.io/dashboard.
    set $shi_nav "";
    if ($http_accept ~* "text/html") { set $shi_nav "1"; }
    if ($http_rsc = "1")              { set $shi_nav "1"; }
    if ($shi_nav) {
        rewrite ^/(dashboard|measurements|doctor-chat|markers|trends|zones|practitioner)(/.*)?$ /sovereign-health/$1$2 last;
    }

    # Backend path-mount (same regex as *.brickos.io). Browser HTML
    # navigation to colliding paths (/admin, /settings, etc.) falls through
    # to the frontend via #556 Accept-header fix.
    location ~ ^/(api|auth|admin|zones|measurements|markers|user-markers|user-medications|user|trends|devices|settings|doctor-chat|practitioner|org-settings|signup|import|export|reports|license|billing|donate|demo|influence-factors|medications|measurement-templates|knowledge|labs|push|sync|health|v1|r)(/|$) {
        # Sprint 046 #579/#580 hotfix 2026-04-20: route HTML navigation AND
        # Next.js RSC prefetches to the frontend. RSC requests send
        # Accept: */* with a special "RSC: 1" header -- without this check
        # the regex above catches them, sends to the backend, and the
        # resulting 401/404/502 errors cause a client-side refresh loop on
        # /measurements and a fake session expiry when the ThresholdsTab
        # prefetches neighbouring routes.
        if ($http_accept ~* "text/html") {
            rewrite ^ /__fe_navigate$uri last;
        }
        if ($http_rsc = "1") {
            rewrite ^ /__fe_navigate$uri last;
        }
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        client_max_body_size 35m;
        proxy_read_timeout 120s;
    }

    location /__fe_navigate {
        internal;
        rewrite ^/__fe_navigate(.*)$ $1 break;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Sprint 042 #538: SW JS must be no-cache so production deploys
    # actually roll out to returning users. Without this, every deploy
    # silently fails to update existing browser sessions for up to 4h.
    location = /sw.js {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        # Re-include because location-level add_header shadows server-level.
        include /etc/nginx/snippets/security-headers.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── Production Anonymous Demo (eval) ─────────────────────────────────────────
# Sprint 049 #049-02 (Design 029 v0.3): dedicated public anonymous-demo
# surface. Unauth visitors see the 3 risk-profile picker on /, and a
# read-only version of the SHI app on /sovereign-health/*. Same Next.js
# bundle as app.sovereignhealth.io -- the frontend keys off the hostname
# via `isEvalHost` to render demo UX + block writes.
#
# Key differences from app.sovereignhealth.io:
#   - No Basic auth (anonymous access required)
#   - No X-Robots-Tag "noai" blanket (we want the landing indexable)
#   - /demo/* is the primary data source (existing backend endpoints)
#   - Rate-limit enforced backend-side by actix governor (Phase B)
server {
    listen 443 ssl http2;
    server_name eval.sovereignhealth.io;

    ssl_certificate /etc/letsencrypt/live/sovereignhealth.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sovereignhealth.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/security-headers.conf;
    proxy_hide_header X-Powered-By;

    proxy_read_timeout 120s;
    client_max_body_size 35m;

    # Sprint 047 pattern: legacy SHI root paths (e.g. external links to
    # /dashboard) map to /sovereign-health/* on this branded domain so the
    # URL bar stays clean for browser navigation but SPA routing still
    # gets the prefixed URI.
    set $shi_nav "";
    if ($http_accept ~* "text/html") { set $shi_nav "1"; }
    if ($http_rsc = "1")              { set $shi_nav "1"; }
    if ($shi_nav) {
        rewrite ^/(dashboard|measurements|doctor-chat|markers|trends|zones|practitioner)(/.*)?$ /sovereign-health/$1$2 last;
    }

    # Backend path-mount -- same regex as app.sovereignhealth.io.
    # /demo/* is the primary entry point for eval data reads.
    location ~ ^/(api|auth|admin|zones|measurements|markers|user-markers|user-medications|user|trends|devices|settings|doctor-chat|practitioner|org-settings|signup|import|export|reports|license|billing|donate|demo|influence-factors|medications|measurement-templates|knowledge|labs|push|sync|health|v1|r)(/|$) {
        if ($http_accept ~* "text/html") {
            rewrite ^ /__fe_navigate$uri last;
        }
        if ($http_rsc = "1") {
            rewrite ^ /__fe_navigate$uri last;
        }
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        client_max_body_size 35m;
        proxy_read_timeout 120s;
    }

    location /__fe_navigate {
        internal;
        rewrite ^/__fe_navigate(.*)$ $1 break;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sw.js {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

