    listen 443 ssl http2;
    server_name *.sovereignhealth.io;

    ssl_certificate /etc/letsencrypt/live/sovereignhealth.io-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sovereignhealth.io-wildcard/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
