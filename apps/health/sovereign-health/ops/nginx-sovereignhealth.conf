    proxy_read_timeout 120s;
    client_max_body_size 35m;

    # Sprint 047 #577 Phase C: legacy SHI root paths -> /sovereign-health/*
    # for the white-label *.sovereignhealth.io domains. Browser nav only.
    set $shi_nav "";
    if ($http_accept ~* "text/html") { set $shi_nav "1"; }
    if ($http_rsc = "1")              { set $shi_nav "1"; }
    if ($shi_nav) {
        rewrite ^/(dashboard|measurements|doctor-chat|markers|trends|zones|practitioner)(/.*)?$ /sovereign-health/$1$2 last;
    }

    location ~ ^/(api|auth|admin|zones|measurements|markers|user-markers|user-medications|user|trends|devices|settings|doctor-chat|practitioner|org-settings|signup|import|export|reports|license|billing|donate|demo|influence-factors|medications|measurement-templates|knowledge|labs|push|sync|health|v1|r)(/|$) {
        # Sprint 046 #579/#580 hotfix 2026-04-20: route HTML navigation AND
        # Next.js RSC prefetches to the frontend. RSC requests send
        # Accept: */* with a special "RSC: 1" header -- without this check
        # the regex above catches them, sends to the backend, and the
        # resulting 401/404/502 errors cause a client-side refresh loop on
        # /measurements and a fake session expiry when the ThresholdsTab
        # prefetches neighbouring routes.
        if ($http_accept ~* "text/html") {
            rewrite ^ /__fe_navigate$uri last;
        }
        if ($http_rsc = "1") {
            rewrite ^ /__fe_navigate$uri last;
        }
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Org-Domain $host;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        client_max_body_size 35m;
        proxy_read_timeout 120s;
    }

    location /__fe_navigate {
        internal;
        rewrite ^/__fe_navigate(.*)$ $1 break;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Org-Domain $host;
    }

    location = /sw.js {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Org-Domain $host;
    }
}

# ── *.demo.sovereignhealth.io (staging wildcard) ─────────────────────────────
# LE wildcard cert issued via DNS-01 (Cloudflare plugin, #560). CF free
# Universal SSL doesn't cover deeper wildcards, so the CF record is
# DNS-only (grey cloud). auth_basic OFF so per-tenant logins work.
# X-Robots-Tag noindex -- staging must not be indexed.
server {
    listen 443 ssl http2;
    server_name *.demo.sovereignhealth.io;

    ssl_certificate /etc/letsencrypt/live/demo.sovereignhealth.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.sovereignhealth.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/security-headers.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;
    proxy_hide_header X-Powered-By;
    proxy_read_timeout 120s;
    client_max_body_size 35m;

    # Sprint 047 #577 Phase C: legacy SHI root paths -> /sovereign-health/*
    # for the white-label staging wildcard. Browser nav only.
    set $shi_nav "";
    if ($http_accept ~* "text/html") { set $shi_nav "1"; }
    if ($http_rsc = "1")              { set $shi_nav "1"; }
    if ($shi_nav) {
        rewrite ^/(dashboard|measurements|doctor-chat|markers|trends|zones|practitioner)(/.*)?$ /sovereign-health/$1$2 last;
    }

    location ~ ^/(api|auth|admin|zones|measurements|markers|user-markers|user-medications|user|trends|devices|settings|doctor-chat|practitioner|org-settings|signup|import|export|reports|license|billing|donate|demo|influence-factors|medications|measurement-templates|knowledge|labs|push|sync|health|v1|r)(/|$) {
        # Sprint 046 #579/#580 hotfix 2026-04-20: route HTML navigation AND
        # Next.js RSC prefetches to the frontend. RSC requests send
        # Accept: */* with a special "RSC: 1" header -- without this check
        # the regex above catches them, sends to the backend, and the
        # resulting 401/404/502 errors cause a client-side refresh loop on
        # /measurements and a fake session expiry when the ThresholdsTab
        # prefetches neighbouring routes.
        if ($http_accept ~* "text/html") {
            rewrite ^ /__fe_navigate$uri last;
        }
        if ($http_rsc = "1") {
            rewrite ^ /__fe_navigate$uri last;
        }
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Org-Domain $host;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        client_max_body_size 35m;
        proxy_read_timeout 120s;
    }

    location /__fe_navigate {
        internal;
        rewrite ^/__fe_navigate(.*)$ $1 break;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Org-Domain $host;
    }

    location = /sw.js {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Org-Domain $host;
    }
}

