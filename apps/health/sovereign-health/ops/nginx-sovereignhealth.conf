# ══════════════════════════════════════════════════════════════════════════════
# HTTP -> HTTPS redirects
# ══════════════════════════════════════════════════════════════════════════════

server {
    listen 80;
    server_name sovereignhealth.io www.sovereignhealth.io;
    return 301 https://$host$request_uri;
}

server {
    listen 80;
    server_name app.sovereignhealth.io;
    return 301 https://$host$request_uri;
}

server {
    listen 80;
    server_name api.sovereignhealth.io;
    return 301 https://$host$request_uri;
}

server {
    listen 80;
    server_name demo.sovereignhealth.io api-demo.sovereignhealth.io www-demo.sovereignhealth.io dev.sovereignhealth.io;
    return 301 https://$host$request_uri;
}

# ══════════════════════════════════════════════════════════════════════════════
# TOR ONION SERVICE
# Accessed via: 4ikzwwyopd5lpv7d2bxtmfddgwr2f3i4au3zevbdj4zbwurcckb7vsqd.onion
# Tor daemon forwards traffic to 127.0.0.1:8443, nginx routes to containers.
# No SSL needed -- Tor provides end-to-end encryption.
# ══════════════════════════════════════════════════════════════════════════════

server {
    listen 127.0.0.1:8443;

    # Security headers (no HSTS -- not applicable for onion services)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Frontend app (default)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP 127.0.0.1;
        proxy_set_header X-Forwarded-For 127.0.0.1;
        proxy_set_header X-Forwarded-Proto http;
        proxy_read_timeout 120s;
    }

    # API backend (same paths as clearnet -- no /api prefix)
    location ~ ^/(auth|health|measurements|markers|zones|trends|calculated-markers|doctor-chat|settings|export|license|billing|influence-factors|import|devices|v1|api|demo|donate|newsletter|contact) {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP 127.0.0.1;
        proxy_set_header X-Forwarded-For 127.0.0.1;
        proxy_set_header X-Forwarded-Proto http;
        proxy_read_timeout 120s;
        client_max_body_size 35m;
    }
}
