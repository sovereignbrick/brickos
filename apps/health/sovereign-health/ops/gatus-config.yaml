# Gatus monitoring configuration — Sovereign Health Intelligence
# Monitors all public endpoints and alerts via ntfy + Telegram.
# Status page served at status.sovereignhealth.io

storage:
  type: sqlite
  path: /data/gatus.db

ui:
  title: "Sovereign Health Status"
  description: "Real-time status of Sovereign Health services"

endpoints:
  # ── Production ──
  - name: "API (Production)"
    group: "Production"
    url: "https://app.brickos.io/api/v1/health?deep=1"
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 3000"
      - "[BODY].status == ok"
      - "[BODY].checks.database.status == ok"
    alerts:
      - type: ntfy
        send-on-resolved: true
        description: "Production API"
      - type: telegram
        send-on-resolved: true
        description: "Production API"

  - name: "API Legacy (Production)"
    group: "Production"
    url: "https://api.sovereignhealth.io/health"
    interval: 300s
    conditions:
      - "[STATUS] == 200"

  - name: "App (Production)"
    group: "Production"
    url: "https://app.brickos.io/"
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 5000"
    alerts:
      - type: ntfy
        send-on-resolved: true
      - type: telegram
        send-on-resolved: true

  - name: "App Legacy (Production)"
    group: "Production"
    url: "https://app.sovereignhealth.io/"
    interval: 300s
    conditions:
      - "[STATUS] == 200"

  - name: "Website"
    group: "Production"
    url: "https://sovereignhealth.io/"
    interval: 120s
    conditions:
      - "[STATUS] == 200"

  # ── Staging ──
  - name: "API (Staging)"
    group: "Staging"
    url: "https://demo.brickos.io/api/v1/health"
    interval: 300s
    conditions:
      - "[STATUS] < 500"
    alerts:
      - type: ntfy
        send-on-resolved: true
        failure-threshold: 3

  - name: "App (Staging)"
    group: "Staging"
    url: "https://demo.brickos.io/"
    interval: 300s
    conditions:
      - "[STATUS] < 500"

  # ── Infrastructure ──
  - name: "ntfy"
    group: "Infrastructure"
    url: "http://ntfy:80"
    interval: 300s
    conditions:
      - "[STATUS] == 200"

  # ── TLS Certificate Expiry ──
  - name: "TLS: app.brickos.io"
    group: "Infrastructure"
    url: "https://app.brickos.io/api/v1/health"
    interval: 21600s
    conditions:
      - "[CERTIFICATE_EXPIRATION] > 7d"
    alerts:
      - type: ntfy
        send-on-resolved: true
      - type: telegram
        send-on-resolved: true

  - name: "TLS: app.sovereignhealth.io"
    group: "Infrastructure"
    url: "https://app.sovereignhealth.io/"
    interval: 21600s
    conditions:
      - "[CERTIFICATE_EXPIRATION] > 7d"
    alerts:
      - type: ntfy
        send-on-resolved: true
      - type: telegram
        send-on-resolved: true

alerting:
  ntfy:
    url: "http://ntfy:80"
    topic: "sh-critical"
    priority: 4
    token: "${NTFY_TOKEN}"
    default-alert:
      failure-threshold: 2
      success-threshold: 2
      send-on-resolved: true
      description: |
        [ALERT_TRIGGERED_OR_RESOLVED] [ENDPOINT_NAME]
        Status: [RESULT_CONDITION_RESULTS]
        Response: [RESULT_HTTP_STATUS] in [RESULT_RESPONSE_TIME]ms
        Consecutive failures: [ALERT_FAILURE_COUNT]
        Time: [RESULT_TIMESTAMP]
        Endpoint: [ENDPOINT_URL]

  telegram:
    token: "${TELEGRAM_BOT_TOKEN}"
    id: "${TELEGRAM_CHAT_ID}"
    default-alert:
      failure-threshold: 2
      success-threshold: 2
      send-on-resolved: true
      description: |
        [ALERT_TRIGGERED_OR_RESOLVED] [ENDPOINT_NAME]
        Status: [RESULT_CONDITION_RESULTS]
        Response: [RESULT_HTTP_STATUS] in [RESULT_RESPONSE_TIME]ms
        Failures: [ALERT_FAILURE_COUNT]
        Time: [RESULT_TIMESTAMP]
        URL: [ENDPOINT_URL]
