# Dev convenience wrapper. Canonical version lives in ops/

services:
  postgres:
    image: postgres:16-alpine
    container_name: sh-postgres
    environment:
      POSTGRES_DB: sovereign_health
      POSTGRES_USER: sovereign_health
      POSTGRES_PASSWORD: dev_password_only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: sh-redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ../api
      dockerfile: Dockerfile
    container_name: sh-backend
    ports:
      - "8080:8080"
    env_file:
      - ../api/.env
    environment:
      - DATABASE_URL=postgres://sovereign_health:dev_password_only@postgres:5432/sovereign_health
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    container_name: sh-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

  website:
    image: nginx:alpine
    container_name: sh-website
    ports:
      - "3100:80"
    volumes:
      - ../website/out:/usr/share/nginx/html:ro
      - ./nginx-website-dev.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
