# Sovereign Health -- self-hosted Docker Compose
# AGPL-3.0 -- https://github.com/sovereignbrick/brickos
#
# Pulls pre-built images from Docker Hub by default (fast path). Users
# who want to build from source can override with `docker compose -f
# docker-compose.selfhosted.yml -f docker-compose.selfhosted-build.yml up`
# (see companion file).
#
# Usage (recommended): bash sh-install.sh
#   -- auto-generates .env, pulls images, starts stack, prints the URL.
#
# Usage (manual):
#   cp ops/.env.example /etc/sovereign-health/.env
#   # edit /etc/sovereign-health/.env (generate DB_PASSWORD, JWT_SECRET,
#   # ENCRYPTION_KEY via `openssl rand -base64 32`)
#   docker compose --env-file /etc/sovereign-health/.env \
#     -f ops/docker-compose.selfhosted.yml up -d
#
# Ports are bound to 127.0.0.1 only -- local access only. Put an
# nginx/Caddy proxy in front for LAN or Tor exposure.

services:
  backend:
    image: sovereignbrick/shi-api:${SHI_VERSION:-latest}
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # Required
      DATABASE_URL: postgres://sovereign_health:${DB_PASSWORD}@db:5432/sovereign_health
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      # Core (oss-mode defaults)
      SHI_MODE: ${SHI_MODE:-oss}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
      RUST_LOG: ${RUST_LOG:-info}
      DEPLOY_ENVIRONMENT: ${DEPLOY_ENVIRONMENT:-selfhosted}
      # Optional AI
      AI_PROVIDER: ${AI_PROVIDER:-none}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
      # Optional email (blank => app skips send; OSS mode auto-verifies signup)
      MAILGUN_API_KEY: ${MAILGUN_API_KEY:-}
      MAILGUN_DOMAIN: ${MAILGUN_DOMAIN:-}
      # Optional billing (blank => Stripe init skipped in oss mode)
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    volumes:
      - shi-uploads:/app/uploads
      - shi-reports:/app/reports
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: sovereignbrick/shi-web:${SHI_VERSION:-latest}
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:8080}
      NEXT_PUBLIC_APP_NAME: Sovereign Health Intelligence
      NEXT_PUBLIC_MODE: ${SHI_MODE:-oss}
    restart: unless-stopped

  db:
    image: sovereignbrick/shi-postgres:${SHI_VERSION:-latest}
    volumes:
      - shi-pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: sovereign_health
      POSTGRES_USER: sovereign_health
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pgaudit"
      - "-c"
      - "pgaudit.log=write,ddl"
      - "-c"
      - "pgaudit.log_catalog=off"
      - "-c"
      - "pgaudit.log_relation=on"
      - "-c"
      - "pgaudit.log_statement_once=on"
      - "-c"
      - "pgaudit.log_parameter=off"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sovereign_health"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  shi-pgdata:
  shi-uploads:
  shi-reports:
