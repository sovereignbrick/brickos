# Security headers -- include in all server blocks
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
# CSP: allow self + API + CDN assets + inline styles (Tailwind)
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://api.sovereignhealth.io https://api-demo.sovereignhealth.io https://ntfy.brickos.io; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
