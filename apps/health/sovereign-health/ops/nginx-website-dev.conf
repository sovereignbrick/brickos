server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Next.js static export: /page/ has /page/index.html
    # Also serve __next RSC data files with correct content type
    location / {
        try_files $uri $uri/ $uri/index.html $uri.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Ensure .txt RSC payloads are served correctly
    location ~ \.__next\..*\.txt$ {
        default_type text/plain;
        try_files $uri =404;
    }

    # Cache static assets
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
