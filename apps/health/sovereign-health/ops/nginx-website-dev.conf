server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Next.js static export: /page/ has /page/index.html
    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    # Cache static assets
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
