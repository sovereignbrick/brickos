<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="627" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.03" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="0" x2="1200" y2="627"/>
    <line x1="400" y1="0" x2="400" y2="627"/>
    <line x1="800" y1="0" x2="800" y2="627"/>
    <line x1="0" y1="209" x2="1200" y2="209"/>
    <line x1="0" y1="418" x2="1200" y2="418"/>
  </g>

  <!-- Accent line top -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>

  <!-- Logo placeholder circle -->
  <circle cx="600" cy="220" r="72" fill="none" stroke="#22c55e" stroke-width="2" opacity="0.6"/>
  <text x="600" y="235" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="#ffffff" letter-spacing="-1">SHI</text>

  <!-- App name -->
  <text x="600" y="350" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="700" fill="#ffffff" letter-spacing="-0.5">Sovereign Health Intelligence</text>

  <!-- Tagline -->
  <text x="600" y="400" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#a1a1aa" letter-spacing="0.5">Privacy-first metabolic health tracking</text>

  <!-- Feature pills -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#d4d4d8">
    <rect x="255" y="440" width="130" height="34" rx="17" fill="#27272a"/>
    <text x="320" y="462" text-anchor="middle">Biomarkers</text>

    <rect x="405" y="440" width="100" height="34" rx="17" fill="#27272a"/>
    <text x="455" y="462" text-anchor="middle">Trends</text>

    <rect x="525" y="440" width="150" height="34" rx="17" fill="#27272a"/>
    <text x="600" y="462" text-anchor="middle">AI Insights</text>

    <rect x="695" y="440" width="110" height="34" rx="17" fill="#27272a"/>
    <text x="750" y="462" text-anchor="middle">Offline</text>

    <rect x="825" y="440" width="120" height="34" rx="17" fill="#27272a"/>
    <text x="885" y="462" text-anchor="middle">Self-Host</text>
  </g>

  <!-- Bottom tagline -->
  <text x="600" y="550" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#71717a" letter-spacing="2">BLOOD  ·  BIOMARKERS  ·  INSIGHT</text>

  <!-- Domain -->
  <text x="600" y="590" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#22c55e" letter-spacing="1">sovereignhealth.io</text>

  <!-- Accent line bottom -->
  <rect x="0" y="623" width="1200" height="4" fill="url(#accent)"/>
</svg>
