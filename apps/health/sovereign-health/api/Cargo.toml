[package]
name = "sovereign-health-backend"
version = "0.26.0"
edition = "2021"

[dependencies]
actix-web = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls", "chrono", "macros", "uuid"] }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
uuid = { version = "1", features = ["v4", "serde"] }
jsonwebtoken = "9"
argon2 = { version = "0.5", features = ["std"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.10"
thiserror = "2"
anyhow = "1"
actix-cors = "0.7"
actix-multipart = "0.7"
futures-util = "0.3"
actix-governor = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
tracing-actix-web = "0.7"
sentry = { version = "0.35", default-features = false, features = ["reqwest", "rustls", "tracing", "backtrace", "contexts", "panic"] }
sentry-actix = "0.35"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
aes-gcm = "0.10"
brickos-auth = { path = "../../../../crates/brickos-auth" }
brickos-crypto = { path = "../../../../crates/brickos-crypto" }
brickos-db = { path = "../../../../crates/brickos-db" }
brickos-billing = { path = "../../../../crates/brickos-billing" }
brickos-email = { path = "../../../../crates/brickos-email" }
async-trait = "0.1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
hmac = "0.12"
totp-rs = { version = "5", features = ["gen_secret", "otpauth"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
genpdf = { version = "0.2", features = ["images"] }
rust_decimal = { version = "1", features = ["serde"] }
rust_decimal_macros = "1"

[dev-dependencies]
proptest = "1"
insta = { version = "1", features = ["json"] }
criterion = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[[bin]]
name = "encrypt-existing-data"
path = "src/bin/encrypt_existing_data.rs"

[[bin]]
name = "migrate-early-access"
path = "src/bin/migrate_early_access.rs"

[[bench]]
name = "endpoints"
harness = false
