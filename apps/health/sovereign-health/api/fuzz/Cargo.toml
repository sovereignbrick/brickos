[package]
name = "sovereign-health-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
arbitrary = { version = "1", features = ["derive"] }

[dependencies.sovereign-health-backend]
path = ".."

[[bin]]
name = "fuzz_health"
path = "fuzz_targets/fuzz_health.rs"
doc = false

[[bin]]
name = "fuzz_search_query"
path = "fuzz_targets/fuzz_search_query.rs"
doc = false

[[bin]]
name = "fuzz_measurement_json"
path = "fuzz_targets/fuzz_measurement_json.rs"
doc = false

[[bin]]
name = "fuzz_login_json"
path = "fuzz_targets/fuzz_login_json.rs"
doc = false

[workspace]
members = ["."]
