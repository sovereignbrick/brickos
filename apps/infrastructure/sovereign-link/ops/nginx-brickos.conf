# ============================================================================
# BrickOS Platform — brickos.io
# Sovereign Link URL shortener routes to health API (Phase 1)
# VPS: 72.61.154.115
# Place at: /etc/nginx/sites-enabled/brickos.io
# ============================================================================

server {
    listen 443 ssl http2;
    server_name brickos.io www.brickos.io;

    ssl_certificate /etc/ssl/cloudflare/brickos.io.pem;
    ssl_certificate_key /etc/ssl/cloudflare/brickos.io.key;

    # -- Sovereign Link: short link redirects --
    location /r/ {
        proxy_pass http://127.0.0.1:8080/r/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
    }

    # -- Placeholder: brickos.io website (future) --
    location / {
        return 302 https://sovereignhealth.io;
    }
}

# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name brickos.io www.brickos.io;
    return 301 https://$host$request_uri;
}
